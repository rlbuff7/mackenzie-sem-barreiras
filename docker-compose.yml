# Infra local do Mackenzie sem Barreiras: banco + API + frontend.
#
#   cp .env.example .env       # primeira vez
#   docker compose up -d --build --wait
#   docker compose ps          # aguarde os três serviços "healthy"
#
# M5 (scripts/ponta-a-ponta.sh) sobe uma pilha ISOLADA a partir deste MESMO
# arquivo, com COMPOSE_PROJECT_NAME=msb-e2e e as portas de *_PORTA_HOST
# trocadas por variável de ambiente — nunca mexe nesta pilha nem no volume dela.

name: mackenzie-sem-barreiras

services:
  db:
    image: postgis/postgis:16-3.4
    # Volta sozinho quando a VM do WSL reinicia; `docker compose stop` ainda para.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    ports:
      # Só localhost: o banco de desenvolvimento não fica exposto na rede.
      - "127.0.0.1:${POSTGRES_PORTA_HOST:-5434}:5432"
    volumes:
      # Volume nomeado, não bind mount: o Postgres exige permissões POSIX
      # no diretório de dados, que o NTFS/OneDrive (/mnt/c) não oferece.
      - pgdata:/var/lib/postgresql/data
      # Substitui o init da imagem: habilita só a extensão postgis.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro da rede do compose o banco atende em "db", na porta interna
      # 5432 — não na porta mapeada no host (POSTGRES_PORTA_HOST, usada só
      # por quem acessa o banco de fora do compose; ver backend/app/config.py).
      POSTGRES_HOST: db
      POSTGRES_PORTA: 5432
    ports:
      # Só localhost, como o banco: a API de desenvolvimento não fica exposta na rede.
      - "127.0.0.1:${API_PORTA_HOST:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sem curl na imagem base (slim): usa o Python do próprio container.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # R19: relativa, não a URL absoluta da API. `frontend/nginx.conf`
        # encaminha `/api/` para o serviço `api` (mesma origem, sem CORS) —
        # e como não depende mais de qual porta a API expõe no host, a MESMA
        # imagem serve tanto esta pilha quanto a pilha isolada do M5.
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      # Só localhost, como os outros dois: o frontend de desenvolvimento não
      # fica exposto na rede. Padrão 8081, não 8080: 8080 costuma já estar
      # ocupada por outro serviço na máquina de quem desenvolve (Jenkins,
      # Tomcat) — G12.
      - "127.0.0.1:${FRONTEND_PORTA_HOST:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx:alpine não tem curl; usa o wget do busybox, que já vem na
      # imagem. "127.0.0.1", não "localhost": nosso nginx.conf substitui o
      # default.conf da imagem sem `listen [::]:80`, então só escuta em
      # IPv4 — e o wget do Alpine resolve "localhost" para ::1 primeiro,
      # o que derrubava o healthcheck com "connection refused" (verificado).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
