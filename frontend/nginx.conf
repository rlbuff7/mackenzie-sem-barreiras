# Serve o build estático do frontend (dist/), copiado no Dockerfile para
# /usr/share/nginx/html. Sem framework de roteamento no app (M4/M5: uma única
# tela), mas o fallback para index.html é mantido porque é o comportamento
# padrão e correto para qualquer SPA servida por nginx.

# Log de acesso SEM IP (docs/coleta-em-campo.md §3). O formato padrão da imagem
# ("main") grava $remote_addr e $http_x_forwarded_for, ou seja, o IP de quem
# reporta (atrás de um túnel, ele chega no X-Forwarded-For). Este guarda só o que
# serve para diagnóstico: quando, método, caminho sem a query string (a do bbox
# diz para onde o mapa estava olhando), status, bytes, tempo total e o status e o
# tempo da API. Sem user agent nem referer. Este arquivo entra no bloco http do
# nginx.conf da imagem, onde log_format precisa estar.
log_format sem_ip '[$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                  'tempo=${request_time}s api=$upstream_status/${upstream_response_time}s';

# Limite de envios (Task 8): só POST /api/alertas entra na conta. A chave do
# limite é o IP do cliente quando a requisição é essa, e vazia (= sem limite)
# para qualquer outra. Atrás de um túnel ou de uma hospedagem com proxy, o IP que
# o nginx enxerga é o do túnel, não o de cada voluntário: o limite vira COLETIVO,
# um só balde para todo mundo. Por isso o valor é largo, dimensionado para uma
# equipe de coleta inteira: 30 relatos por minuto de média, com rajada de 20 de
# uma vez (`burst`, sem espera: `nodelay`). Um relato leva dezenas de segundos
# para ser preenchido; passar disso é script, não voluntário. Ajustar aqui se a
# equipe crescer. O corpo maior que 16k é barrado antes, pelo client_max_body_size.
map "$request_method $uri" $chave_limite_envio {
    default "";
    "POST /api/alertas" $binary_remote_addr;
    "POST /api/alertas/" $binary_remote_addr;
}
limit_req_zone $chave_limite_envio zone=envio_de_relatos:1m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log sem_ip;
    # As mensagens de erro do nginx trazem "client: <IP>" e não têm formato
    # configurável. Em "crit" saem só os erros gravíssimos, e as mensagens de
    # requisição que este servidor pode gerar (limite de taxa, corpo grande
    # demais, cliente que fecha a conexão) ficam abaixo desse nível e não são
    # registradas. Erros raros de "crit" (por exemplo, EMFILE, falta de
    # descritores de arquivo) podem sim registrar "client: <IP>": este log não
    # promete ausência total de IP, só que o uso normal não o grava. Para
    # diagnosticar, o log de acesso já mostra o status e o status da API (ex.:
    # 502 com api=502 = API fora do ar), e o log da API continua completo
    # (`docker compose logs api`).
    error_log /var/log/nginx/error.log crit;

    # Qualquer caminho que não seja um arquivo real cai no index.html: é o
    # app quem decide o que fazer com a rota, nunca o nginx devolvendo 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # R19: a API fica na MESMA origem do frontend, atrás de /api/ — o build
    # usa VITE_API_URL=/api (docker-compose.yml), então o navegador nunca faz
    # requisição cross-origin nenhuma, e CORS deixa de ser necessário para o
    # frontend em container (só o servidor de dev do Vite, em 5173, ainda
    # precisa de CORS_ORIGENS). "api" é o nome do serviço no docker compose:
    # resolve pela rede interna do projeto (a mesma para a pilha principal e
    # para a pilha isolada do M5, cada uma com o seu próprio serviço `api`).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O IP do cliente não vai para a API: ela não precisa dele, e o uvicorn
        # registra só o endereço interno deste nginx na rede do compose. Um
        # X-Forwarded-For vindo de um túnel também é descartado aqui (vazio =
        # o nginx não repassa o header).
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # Curto de propósito: se a API não estiver de pé, falha rápido em vez
        # de deixar quem reportou uma barreira esperando pelo timeout padrão.
        proxy_connect_timeout 3s;
        # Corpo máximo de um POST: 16 KiB (um relato tem cerca de 400 bytes). Acima
        # disso o nginx responde 413 sem passar o corpo para a API, que aplica o
        # mesmo limite (LIMITE_CORPO_BYTES no .env: mantenha os dois iguais).
        client_max_body_size 16k;
        # Ver `limit_req_zone` acima: só POST /api/alertas é limitado. 429 (não o
        # 503 padrão) é o que o frontend traduz em "Muitos envios em sequência".
        limit_req zone=envio_de_relatos burst=20 nodelay;
        limit_req_status 429;
    }

    # index.html nunca fica em cache: é ele quem referencia os arquivos com
    # hash abaixo, e uma atualização de deploy precisa ser vista na próxima
    # visita, não só depois do cache expirar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # O Vite grava o hash do conteúdo no nome de cada arquivo em assets/
    # (ex.: main-a1b2c3d4.js): o nome muda sempre que o conteúdo muda, então
    # o arquivo pode ficar em cache pelo tempo que for — "immutable" evita até
    # a revalidação condicional (If-None-Match) a cada visita.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
