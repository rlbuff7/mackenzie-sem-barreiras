# Serve o build estático do frontend (dist/), copiado no Dockerfile para
# /usr/share/nginx/html. Sem framework de roteamento no app (M4/M5: uma única
# tela), mas o fallback para index.html é mantido porque é o comportamento
# padrão e correto para qualquer SPA servida por nginx.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Qualquer caminho que não seja um arquivo real cai no index.html: é o
    # app quem decide o que fazer com a rota, nunca o nginx devolvendo 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca fica em cache: é ele quem referencia os arquivos com
    # hash abaixo, e uma atualização de deploy precisa ser vista na próxima
    # visita, não só depois do cache expirar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # O Vite grava o hash do conteúdo no nome de cada arquivo em assets/
    # (ex.: main-a1b2c3d4.js): o nome muda sempre que o conteúdo muda, então
    # o arquivo pode ficar em cache pelo tempo que for — "immutable" evita até
    # a revalidação condicional (If-None-Match) a cada visita.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
